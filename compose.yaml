name: ripperr-worker

services:
  worker:
    platform: linux/amd64
    build:
      context: .
      target: runtime
    image: ripperr-worker:local
    restart: unless-stopped
    environment:
      HOME: /models/home
      HF_HOME: /models/home/.cache/huggingface
      NEEDLE_TELEMETRY: "0"
      RIPPERR_SERVER: ${RIPPERR_SERVER:?Set RIPPERR_SERVER in .env}
      RIPPERR_API_TOKEN: ${RIPPERR_API_TOKEN:?Set RIPPERR_API_TOKEN in .env}
      RIPPERR_HF_TOKEN: ${RIPPERR_HF_TOKEN:-}
      RIPPERR_WORKER_NAME: ${RIPPERR_WORKER_NAME:-ripperr-mac-pro}
      RIPPERR_ASR_BACKEND: ${RIPPERR_ASR_BACKEND:-whistle}
      RIPPERR_ASR_MODEL: ${RIPPERR_ASR_MODEL:-Cactus-Compute/whistle}
      RIPPERR_ASR_KEYWORDS: ${RIPPERR_ASR_KEYWORDS:-}
      RIPPERR_DIARIZATION_BACKEND: ${RIPPERR_DIARIZATION_BACKEND:-senko}
      RIPPERR_DIARIZATION_MODEL: ${RIPPERR_DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      RIPPERR_DEVICE: ${RIPPERR_DEVICE:-cpu}
      RIPPERR_LANGUAGE: ${RIPPERR_LANGUAGE:-}
    volumes:
      - model-cache:/models
    cpus: 3.0
    mem_limit: 6g

volumes:
  model-cache:
